name: ci

on:
  push:
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: make
      - name: Smoke test
        run: |
          ./examples/hello_world &
          PID=$!
          sleep 1
          curl -f http://127.0.0.1:8080/ || exit 1
          kill $PID

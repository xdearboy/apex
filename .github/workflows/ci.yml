name: ci

on:
  push:
  pull_request:

jobs:
  build-test:
    runs-on: tachyon-runners
    container:
      image: gcc:bookworm
    steps:
      - name: deps
        run: apt-get update && apt-get install -y --no-install-recommends libssl-dev pkg-config
      - uses: actions/checkout@v4
      - name: build
        run: make
      - name: unit tests
        run: make test

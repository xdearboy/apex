# ==============================================================================
# Apex Reference Configuration (Production)
# Documentation: https://github.com/xdearboy/apex
#
# Test syntax:  apex -t
# Reload:       systemctl reload apex  (or: kill -HUP $(pidof apex))
# ==============================================================================

# Core worker settings
# worker_processes auto;  # defaults to number of CPU cores

http {
    # Connection and buffer tuning
    worker_connections 65536;
    keepalive_timeout 75s;
    keepalive_requests 10000;
    client_header_timeout 15s;
    client_body_timeout 30s;
    client_max_body_size 64m;
    server_tokens off;

    # Compression (Gzip, Brotli, Zstandard)
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    brotli on;
    brotli_comp_level 4;
    zstd on;
    zstd_comp_level 3;

    # Logging formats
    log_format combined "$remote_addr - $remote_user [$time_local] \"$request\" $status $bytes_sent \"$http_referer\" \"$http_user_agent\"";
    log_format json '{"time":"$time_iso8601","remote_addr":"$remote_addr","request":"$request","status":$status,"bytes_sent":$bytes_sent,"request_time":$request_time,"upstream_response_time":$upstream_response_time}';

    # Default access log (can be overridden per server or disabled with 'access_log off;')
    access_log "/var/log/apex/access.log" buffer=64k flush=1s;

    # Rate limiting zones
    limit_req_zone "$remote_addr" zone=req_limit:10m rate=100r/s;
    limit_conn_zone "$remote_addr" zone=conn_limit:10m;

    # Cache zones
    proxy_cache_path "/var/cache/apex" keys_zone=apex_cache:32m max_size=1g inactive=24h;

    # Upstream backend pool
    upstream backend_pool {
        policy p2c; # Power-of-Two-Choices with EWMA latency
        server 127.0.0.1:9001 weight=2 max_conns=1024;
        server 127.0.0.1:9002 weight=1 max_conns=1024;
        keepalive 128;
        connect_timeout 2s;
        read_timeout 10s;
        idle_timeout 60s;
    }

    # Default server block
    server {
        listen ":8080";
        server_name _;

        # Healthcheck endpoint (zero latency, no disk hit)
        location "=" "/health" {
            access_log off;
            return 200 "OK\n";
        }

        # Status & Metrics endpoint for Prometheus
        location "=" "/metrics" {
            metrics on;
        }

        # Reverse proxy location
        location "/api/" {
            proxy_pass backend_pool;
            proxy_set_header "Host" "$host";
            proxy_set_header "X-Real-IP" "$remote_addr";
            proxy_set_header "X-Forwarded-For" "$proxy_add_x_forwarded_for";
            proxy_set_header "X-Forwarded-Proto" "$scheme";
            proxy_http_version 1.1;

            limit_req zone=req_limit burst=50 nodelay;
        }

        # Static assets
        location "/static/" {
            root "/var/www/static";
            proxy_cache apex_cache;
            proxy_cache_valid 200 1h;
            proxy_cache_valid 404 1m;
            add_header "Cache-Control" "public, max-age=3600";
        }

        # Catch-all
        location "/" {
            return 200 "Welcome to Apex Reverse Proxy!\n";
        }
    }

    # Include modular virtual host configurations (like Nginx conf.d)
    include "conf.d/*.conf";
}

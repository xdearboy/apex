# Apex phase 2 reference configuration.
#
# Validate with:  ./apex -t conf/apex.conf
# Run with:       ./apex -c conf/apex.conf

http {
    worker_connections 4096;
    keepalive_timeout 75s;
    client_header_timeout 15s;
    client_body_timeout 30s;
    server_tokens off;

    upstream api {
        server 127.0.0.1:9001 weight=2;
        server 127.0.0.1:9002;
        server 127.0.0.1:9003 weight=3 max_conns=512;

        policy p2c;
        keepalive 64;
        connect_timeout 2s;
        read_timeout 10s;
        idle_timeout 60s;
    }

    upstream static {
        server 127.0.0.1:9010;
        algorithm round_robin;
        keepalive 32;
    }

    server {
        listen ":8080";
        server_name example.com www.example.com;

        location "=" "/health" {
            return 200 "OK\n";
        }

        location "/api/" {
            proxy_pass api;
            proxy_set_header "X-Forwarded-Proto" "https";
            proxy_set_header "X-Apex-Edge" "phase-2";
            proxy_connect_timeout 1s;
            proxy_read_timeout 5s;
            proxy_http_version 1.1;
        }

        location "/static/" {
            proxy_pass static;
        }

        location "/" {
            return 200 "Welcome to Apex!\n";
        }
    }
}

